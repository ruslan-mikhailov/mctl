[package]
name = "mctl"
version = "0.1.1"
edition = "2024"
description = "Interactive Memcached text-protocol shell"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
directories = "6"
libc = "0.2"
nu-ansi-term = "0.50"
parking_lot = "0.12"
reedline = { version = "0.51", features = ["idle_callback"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
tempfile = "3"

[dev-dependencies]
rcgen = "0.14"
